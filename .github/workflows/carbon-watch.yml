name: Carbon Watch Agent

on:
  # Run daily at 08:00 IST (UTC+5:30) = 02:30 UTC
  schedule:
    - cron: "30 2 * * *"

  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository so the runner has access to the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the Python version the project targets
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install all required dependencies directly (no requirements.txt needed)
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install groq requests beautifulsoup4 python-dotenv schedule resend lxml

      # 4. Run the agent — secrets are injected as environment variables
      #    so python-dotenv picks them up via os.getenv() just like a local .env
      - name: Run Carbon Watch Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python main.py
